<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="timerGrad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glowTimer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#0d0d12" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#timerGrad)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Top Stopwatch Crown / Button -->
  <rect x="28" y="7" width="8" height="4" rx="1.5" fill="#f59e0b" />
  <line x1="32" y1="11" x2="32" y2="15" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

  <!-- Outer Dial Ring -->
  <circle cx="32" cy="36" r="19" stroke="#27272a" stroke-width="3" />
  
  <!-- Glowing Countdown Arc (Counting down the final quarter) -->
  <path d="M32 17 A19 19 0 1 1 13 36" stroke="url(#timerGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glowTimer)" />

  <!-- Dial Center Pivot -->
  <circle cx="32" cy="36" r="3" fill="#f59e0b" />

  <!-- Clock Hands pointing to countdown strike (11:59 / T-minus) -->
  <line x1="32" y1="36" x2="32" y2="22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="36" x2="43" y2="30" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  
  <!-- Subtle Dial Tick Marks -->
  <circle cx="32" cy="20" r="1" fill="#f59e0b" />
  <circle cx="48" cy="36" r="1" fill="#71717a" />
  <circle cx="32" cy="52" r="1" fill="#71717a" />
  <circle cx="16" cy="36" r="1" fill="#71717a" />
</svg>
