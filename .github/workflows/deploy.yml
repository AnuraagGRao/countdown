name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Inject TMDB Secrets
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN || secrets.API_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.API_KEY }}
        run: |
          node -e "
            const fs = require('fs');
            const token = process.env.TMDB_API_READ_ACCESS_TOKEN || '';
            const key = process.env.TMDB_API_KEY || '';
            const content = 'export const TMDB_SECRETS = ' + JSON.stringify({ API_KEY: key, API_READ_ACCESS_TOKEN: token }, null, 2) + ';\n';
            fs.writeFileSync('secrets.js', content, 'utf8');
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
